<input type="file" id="photoInput" accept="image/*" class="hidden">

<script>
/* ---------------- সাধারণ ---------------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => (v === null || v === undefined || v === "") ? "-" : (+v % 1 ? (+v).toFixed(2).replace(/0$/,"") : String(+v));
const fmtDate = d => { if(!d) return ""; const x = new Date(d); return isNaN(x) ? d : x.toLocaleDateString("bn-BD",{day:"numeric",month:"long",year:"numeric"}); };
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
let TOKEN = store.get("bn_token"), ROLE = store.get("bn_role");
let ME = null, RESULTS = [], PW_FORCED = false, CHAT_TIMER = null;

function toast(msg, ms=2600){
  const t = document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), ms);
}
function show(id){
  if(id==="homeView") loadHome();
  ["homeView","loginView","pwView","stuView","admView"].forEach(v => $("#"+v).classList.toggle("hidden", v!==id));
  window.scrollTo(0,0);
}
const configured = () => !SUPABASE_URL.includes("PASTE_") && !SUPABASE_KEY.includes("PASTE_");

async function rpc(fn, args={}){
  const headers = {"Content-Type":"application/json", "apikey": SUPABASE_KEY};
  if (SUPABASE_KEY.startsWith("eyJ")) headers["Authorization"] = "Bearer " + SUPABASE_KEY;
  let res;
  try{
    res = await fetch(SUPABASE_URL.replace(/\/$/,"") + "/rest/v1/rpc/" + fn, {method:"POST", headers, body: JSON.stringify(args)});
  }catch(e){ throw new Error("ইন্টারনেট সংযোগ নেই বা সার্ভারে পৌঁছানো যাচ্ছে না"); }
  const txt = await res.text();
  let data = null; try{ data = txt ? JSON.parse(txt) : null; }catch(e){}
  if(!res.ok){
    const msg = (data && (data.message || data.hint)) || ("সমস্যা হয়েছে (" + res.status + ")");
    if (msg.includes("SESSION_EXPIRED")) { logoutLocal(); toast("সেশন শেষ, আবার লগইন করো"); throw new Error("আবার লগইন করো"); }
    throw new Error(msg);
  }
  return data;
}
function logoutLocal(){ TOKEN=null; ROLE=null; ME=null; store.del("bn_token"); store.del("bn_role"); $("#lgPass").value=""; show("homeView"); }
async function logout(){ try{ await rpc("logout",{p_token:TOKEN}); }catch(e){} logoutLocal(); }

/* ---------------- লগইন ---------------- */
$("#lgName").textContent = COACHING.name;
$("#lgFoot").innerHTML = esc(COACHING.address) + "<br>📞 " + esc(COACHING.phones) + (COACHING.whatsapp ? '<br><a class="wa" style="display:inline-block;margin-top:8px" target="_blank" rel="noopener" href="'+waLink(COACHING.whatsapp,"")+'">📲 WhatsApp: '+esc(COACHING.whatsapp)+'</a>' : "");
$("#loginForm").onsubmit = async e => {
  e.preventDefault();
  const err = $("#lgErr"); err.classList.add("hidden");
  if(!configured()){ err.textContent="সাইটটা এখনো Supabase-এর সাথে যুক্ত করা হয়নি (index.html-এর উপরের দুই লাইন)।"; err.classList.remove("hidden"); return; }
  const b = $("#lgBtn"); b.disabled=true; b.textContent="অপেক্ষা করো...";
  try{
    const r = await rpc("login", {p_roll: $("#lgRoll").value.trim(), p_pass: $("#lgPass").value});
    if(r.error) throw new Error(r.error);
    TOKEN=r.token; ROLE=r.role; store.set("bn_token",TOKEN); store.set("bn_role",ROLE);
    if(r.must_change){ PW_FORCED = true; $("#pwOld").value = $("#lgPass").value; show("pwView"); }
    else start();
  }catch(ex){ err.textContent=ex.message; err.classList.remove("hidden"); }
  b.disabled=false; b.textContent="লগইন";
};
$("#pwForm").onsubmit = async e => {
  e.preventDefault();
  const err=$("#pwErr"); err.classList.add("hidden");
  if($("#pwNew").value !== $("#pwNew2").value){ err.textContent="দুইবার লেখা নতুন পাসওয়ার্ড মিলছে না"; err.classList.remove("hidden"); return; }
  try{
    await rpc("change_password",{p_token:TOKEN,p_old:$("#pwOld").value,p_new:$("#pwNew").value});
    ["#pwOld","#pwNew","#pwNew2"].forEach(s=>$(s).value="");
    PW_FORCED = false; toast("পাসওয়ার্ড সেভ হয়েছে ✅"); start();
  }catch(ex){ err.textContent=ex.message; err.classList.remove("hidden"); }
};
$("#pwCancel").onclick = () => PW_FORCED ? logout() : start();

function start(){ if(ROLE==="admin"){ show("admView"); admTab("students"); refreshBadge(); } else { show("stuView"); loadStudent(); } }

/* ---------------- স্টুডেন্ট ---------------- */
document.querySelectorAll("#stuNav button").forEach(b => b.onclick = () => stuTab(b.dataset.tab));
async function loadStudent(){
  $("#stuMain").innerHTML = '<div class="spin"></div>';
  try{
    [ME, RESULTS] = await Promise.all([rpc("me",{p_token:TOKEN}), rpc("my_results",{p_token:TOKEN})]);
    if(ME.must_change){ PW_FORCED = true; show("pwView"); return; }
    paintHeader(); if(!ME.profile_done) stuProfile(true); else stuTab("home"); refreshBadge();
  }catch(ex){ $("#stuMain").innerHTML = '<div class="err">'+esc(ex.message)+'</div>'; }
}
function initials(n){ return esc((n||"?").trim().charAt(0)); }
function paintHeader(){
  $("#hdName").textContent = ME.name;
  $("#hdRoll").textContent = "রোল " + ME.roll + (ME.batch ? " • " + ME.batch : "");
  $("#hdAv").innerHTML = ME.photo ? '<img src="'+ME.photo+'" alt="">' : initials(ME.name);
}
function stuTab(t){
  document.querySelectorAll("#stuNav button").forEach(b=>b.classList.toggle("on", b.dataset.tab===t));
  window.scrollTo(0,0);
  clearInterval(CHAT_TIMER);
  ({home:stuHome, results:stuResults, merit:stuMerit, id:stuId, notices:stuNotices, msg:stuMsg})[t]();
}
function resultCard(r, withShare=true){
  const pct = r.total_marks ? Math.max(0, Math.min(100, r.marks / r.total_marks * 100)) : 0;
  return `<div class="card res">
    <div class="row between"><div><b>${esc(r.title)}</b><div class="muted">${esc(r.subject||"")}${r.subject?" • ":""}${fmtDate(r.exam_date)}</div></div>
    ${r.rank==1?'<span class="chip">🥇 প্রথম</span>':""}</div>
    <div class="row between" style="margin-top:8px"><div class="big">${num(r.marks)}<small> / ${num(r.total_marks)}</small></div>
    <div style="text-align:right"><b style="font-size:20px">#${r.rank}</b><div class="muted">${r.participants} জনের মধ্যে</div></div></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="grid4">
      <div><b>${num(r.highest)}</b><span>সর্বোচ্চ</span></div>
      <div><b>${num(r.average)}</b><span>গড়</span></div>
      <div><b>${r.correct ?? "-"}</b><span>সঠিক</span></div>
      <div><b>${r.wrong ?? "-"}</b><span>ভুল</span></div>
    </div>
    ${withShare?`<button class="btn sec" onclick="shareResult(${r.exam_id})">📤 রেজাল্ট কার্ড শেয়ার করো</button>`:""}
  </div>`;
}
async function stuHome(){
  const n = RESULTS.length;
  const avg = n ? Math.round(RESULTS.reduce((s,r)=>s + (r.total_marks? r.marks/r.total_marks*100 : 0),0)/n) : 0;
  const best = n ? Math.min(...RESULTS.map(r=>r.rank)) : "-";
  $("#stuMain").innerHTML = `
    <div class="hero">
      <div class="ph">${ME.photo?'<img src="'+ME.photo+'" alt="">':initials(ME.name)}</div>
      <div style="min-width:0"><b>${esc(ME.name)}</b><small>রোল ${esc(ME.roll)}${ME.batch?" • "+esc(ME.batch):""}</small>
      <div><button class="btn sm" style="margin-top:8px;background:#fff;color:var(--g)" onclick="$('#photoInput').click()">📷 ${ME.photo?"ছবি বদলাও":"ছবি যোগ করো"}</button></div></div>
    </div>
    <div class="stats">
      <div class="stat"><b>${n}</b><span>পরীক্ষা দিয়েছ</span></div>
      <div class="stat"><b>${n?avg+"%":"-"}</b><span>গড় নম্বর</span></div>
      <div class="stat"><b>${n?"#"+best:"-"}</b><span>সেরা র‍্যাংক</span></div>
    </div>
    <div class="sec-title">সর্বশেষ রেজাল্ট</div>
    ${n ? resultCard(RESULTS[0]) : '<div class="card muted">এখনো কোনো রেজাল্ট আসেনি। পরীক্ষার পর এখানে দেখতে পাবে।</div>'}
    <div id="homeNotice"></div>
    <div class="card">
      <h3>⭐ BIO NERDS সম্পর্কে তোমার মতামত</h3>
      <div class="muted">ক্লাস, পড়ানো বা পরীক্ষা নিয়ে তোমার অভিজ্ঞতা লেখো। স্যার অনুমোদন দিলে হোম পেজে তোমার নাম ও ছবিসহ দেখাবে।</div>
      <div class="rate" id="fbRate">${[1,2,3,4,5].map(i=>`<span data-v="${i}" class="on">★</span>`).join("")}</div>
      <textarea id="fbBody" style="font-family:inherit;min-height:90px" maxlength="600" placeholder="যেমন: স্যারের পড়ানোর কারণে কোষ বিভাজন এখন খুব সহজ লাগে..."></textarea>
      <button class="btn sec" id="fbSend">পাঠাও</button>
    </div>
    <div class="card">
      <h3>👤 আমার প্রোফাইল</h3>
      <table class="tbl">
        <tr><td class="muted">ক্লাস</td><td>${esc(ME.class_name)||"-"}</td></tr>
        <tr><td class="muted">কলেজ/স্কুল</td><td>${esc(ME.institution)||"-"}</td></tr>
        <tr><td class="muted">বাবা</td><td>${esc(ME.father_name)||"-"}<br><span class="muted">${esc(ME.father_phone)}</span></td></tr>
        <tr><td class="muted">মা</td><td>${esc(ME.mother_name)||"-"}<br><span class="muted">${esc(ME.mother_phone)}</span></td></tr>
        <tr><td class="muted">নিজের মোবাইল</td><td>${esc(ME.phone)||"-"}</td></tr>
      </table>
      <button class="btn sec" onclick="stuProfile(false)">✏️ প্রোফাইল এডিট করো</button>
      <button class="btn ghost" onclick="openChangePw()">🔑 পাসওয়ার্ড বদলাও</button>
      <button class="btn ghost" onclick="show('homeView')">🌐 কোচিংয়ের হোম পেজ</button>
      <button class="btn danger" onclick="logout()">লগআউট</button>
    </div>`;
  let rating = 5;
  document.querySelectorAll("#fbRate span").forEach(s => s.onclick = () => { rating = +s.dataset.v;
    document.querySelectorAll("#fbRate span").forEach(x => x.classList.toggle("on", +x.dataset.v <= rating)); });
  $("#fbSend").onclick = async () => {
    const v = $("#fbBody").value.trim(); if(v.length < 5){ toast("মতামত একটু বিস্তারিত লেখো"); return; }
    try{ await rpc("submit_feedback",{p_token:TOKEN,p_body:v,p_rating:rating}); $("#fbBody").value=""; toast("ধন্যবাদ! মতামত পাঠানো হয়েছে ✅"); }
    catch(ex){ toast(ex.message); }
  };
  try{
    const ns = await rpc("get_notices",{p_token:TOKEN});
    if(ns.length) $("#homeNotice").innerHTML = '<div class="sec-title">নতুন নোটিশ</div>' + noticeCard(ns[0]);
  }catch(e){}
}
function stuProfile(forced){
  $("#stuNav").classList.toggle("hidden", !!forced);
  window.scrollTo(0,0);
  const v = k => esc(ME[k]||"");
  $("#stuMain").innerHTML = `
    <div class="sec-title">${forced?"👋 স্বাগতম! আগে তোমার প্রোফাইল পূরণ করো":"✏️ প্রোফাইল এডিট"}</div>
    <div class="card"><form id="pf">
      <label>তোমার নাম</label>
      <input id="pfName" value="${v("name")}" ${ME.name?"disabled":""} placeholder="পুরো নাম (ইংরেজিতে)">
      ${ME.name?'<div class="hint" style="margin-top:4px">নাম ভুল থাকলে কোচিংয়ে জানাও</div>':""}
      <label>কোন ক্লাসে পড়ো</label>
      <select id="pfClass"><option value="">— বেছে নাও —</option><option ${ME.class_name==="Class 6"?"selected":""}>Class 6</option><option ${ME.class_name==="Class 7"?"selected":""}>Class 7</option><option ${ME.class_name==="Class 8"?"selected":""}>Class 8</option><option ${ME.class_name==="Class 9"?"selected":""}>Class 9</option><option ${ME.class_name==="Class 10"?"selected":""}>Class 10</option><option ${ME.class_name==="SSC Candidate"?"selected":""}>SSC Candidate</option><option ${ME.class_name==="HSC 1st Year"?"selected":""}>HSC 1st Year</option><option ${ME.class_name==="HSC 2nd Year"?"selected":""}>HSC 2nd Year</option><option ${ME.class_name==="HSC Candidate"?"selected":""}>HSC Candidate</option><option ${ME.class_name==="Admission"?"selected":""}>Admission</option></select>
      <label>কলেজ / স্কুল</label><input id="pfInst" value="${v("institution")}" placeholder="যেমন: Cumilla Victoria Govt. College">
      <label>বাবার নাম</label><input id="pfFather" value="${v("father_name")}" placeholder="বাবার নাম">
      <label>বাবার মোবাইল নম্বর</label><input id="pfFP" value="${v("father_phone")}" inputmode="tel" placeholder="01XXXXXXXXX">
      <label>মায়ের নাম</label><input id="pfMother" value="${v("mother_name")}" placeholder="মায়ের নাম">
      <label>মায়ের মোবাইল নম্বর</label><input id="pfMP" value="${v("mother_phone")}" inputmode="tel" placeholder="01XXXXXXXXX">
      <label>তোমার নিজের মোবাইল নম্বর</label><input id="pfPhone" value="${v("phone")}" inputmode="tel" placeholder="01XXXXXXXXX">
      <button class="btn" type="submit">সেভ করো</button><div id="pfErr" class="err hidden"></div>
      ${forced?"":'<button class="btn ghost" type="button" onclick="stuTab(\'home\')">বাতিল</button>'}
    </form></div>`;
  $("#pf").onsubmit = async e => {
    e.preventDefault(); const err=$("#pfErr"); err.classList.add("hidden");
    const d={p_token:TOKEN,p_name:$("#pfName").value,p_class:$("#pfClass").value,p_inst:$("#pfInst").value,p_father:$("#pfFather").value,p_fphone:$("#pfFP").value,p_mother:$("#pfMother").value,p_mphone:$("#pfMP").value,p_phone:$("#pfPhone").value};
    try{ await rpc("set_profile",d); ME = await rpc("me",{p_token:TOKEN}); paintHeader(); $("#stuNav").classList.remove("hidden"); toast("প্রোফাইল সেভ হয়েছে ✅"); stuTab("home"); }
    catch(ex){ err.textContent=ex.message; err.classList.remove("hidden"); }
  };
}
function openChangePw(){ PW_FORCED = false; $("#pwOld").value=""; show("pwView"); }
function stuResults(){
  $("#stuMain").innerHTML = '<div class="sec-title">আমার সব রেজাল্ট</div>' +
    (RESULTS.length ? RESULTS.map(r=>resultCard(r)).join("") : '<div class="card muted">এখনো কোনো রেজাল্ট নেই।</div>');
}
async function stuMerit(examId){
  if(!RESULTS.length){ $("#stuMain").innerHTML='<div class="sec-title">মেরিট লিস্ট</div><div class="card muted">পরীক্ষা দেওয়ার পর মেরিট লিস্ট দেখতে পাবে।</div>'; return; }
  examId = examId || RESULTS[0].exam_id;
  $("#stuMain").innerHTML = `<div class="sec-title">🏆 মেরিট লিস্ট</div>
    <div class="card"><label style="margin-top:0">পরীক্ষা বেছে নাও</label>
    <select id="mSel">${RESULTS.map(r=>`<option value="${r.exam_id}" ${r.exam_id==examId?"selected":""}>${esc(r.title)} — ${fmtDate(r.exam_date)}</option>`).join("")}</select></div>
    <div id="mList"><div class="spin"></div></div>`;
  $("#mSel").onchange = e => stuMerit(+e.target.value);
  try{
    const m = await rpc("merit",{p_token:TOKEN,p_exam:examId});
    const mine = RESULTS.find(r=>r.exam_id==examId);
    $("#mList").innerHTML = `<div class="card"><h3>টপ ১০ — ${esc(m.exam.title)}</h3><ul class="merit">` +
      m.top.map(t=>`<li class="${t.roll===ME.roll?"me":""}">
        <div class="rk ${t.rank<=3?"r"+t.rank:""}">${t.rank<=3?["🥇","🥈","🥉"][t.rank-1]:t.rank}</div>
        ${t.photo?`<img class="mph" src="${t.photo}" alt="">`:""}

function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

async function drawPhoto(ctx, x, y, size, round){
  ctx.save();
  if(round){ ctx.beginPath(); ctx.arc(x+size/2,y+size/2,size/2,0,Math.PI*2); ctx.clip(); } else { rr(ctx,x,y,size,size*1.2,18); ctx.clip(); }
  const h = round?size:size*1.2;
  if(ME.photo){ const img = await loadImg(ME.photo); const s=Math.min(img.width,img.height*size/h);
    ctx.drawImage(img,(img.width-s)/2,0,s,s*h/size,x,y,size,h); }
  else { ctx.fillStyle="#dfe9e4"; ctx.fillRect(x,y,size,h); ctx.fillStyle="#13684c"; ctx.font=`700 ${size/2.4}px "Hind Siliguri"`; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText((ME.name||"?").trim().charAt(0),x+size/2,y+h/2); }
  ctx.restore();
}

function parseRoutine(txt){
  return String(txt||"").split(/\r?\n/).map(l=>l.trim()).filter(l=>l.includes("=")).map(l=>{
    const i=l.indexOf("="), batch=l.slice(0,i).trim();
    const slots=l.slice(i+1).split(",").map(s=>s.trim()).filter(Boolean).map(s=>{ const k=s.indexOf(" "); return k>0?{day:s.slice(0,k),time:s.slice(k+1)}:{day:s,time:""}; });
    return {batch, slots};
  });
}

      <div class="stars">${list.map(x=>`<div class="star s${x.rank}"><span class="md">${["🥇","🥈","🥉"][x.rank-1]}</span>
        <div class="sp">${x.photo?`<img src="${x.photo}" alt="" loading="lazy">`:esc((x.name||"?").trim().charAt(0))}</div>
        <b>${esc(x.name)}</b><div class="si">${esc(x.institution||"")}</div><span class="pc">${num(x.pct)}%</span></div>`).join("")}</div>
      <div class="muted" style="text-align:center;margin-top:8px;font-size:12.5px">সপ্তাহের পরীক্ষাগুলোর গড় নম্বরের ভিত্তিতে</div>`;
  }

  // রুটিন
  if(routine.length){
    html += `<div class="h-sec">🗓️ ক্লাস রুটিন <small>আজ ${today}</small></div>` + routine.map(r=>`<div class="rt"><div class="rb">${esc(r.batch)}</div>
      ${r.slots.map(sl=>`<div class="slot"><span class="day">${esc(sl.day)}</span><span class="tm">${esc(sl.time)}</span>${sl.day===today?'<span class="today">আজ</span>':""}</div>`).join("")}</div>`).join("");
  }

  // মতামত
  const fb = h.feedback || [];
  if(fb.length){
    html += `<div class="h-sec">💬 স্টুডেন্টদের মতামত</div><div class="fbw">${fb.map(f=>`<div class="fb">
      <div class="rs">${"★".repeat(f.rating||5)}</div><div class="q">“${esc(f.body)}”</div>
      <div class="who"><div class="av">${f.photo?`<img src="${f.photo}" alt="" loading="lazy">`:esc((f.name||"?").trim().charAt(0))}</div>
      <div style="min-width:0"><b>${esc(f.name||"")}</b><div class="muted" style="font-size:12.5px">${esc(f.meta||"")}</div></div></div></div>`).join("")}</div>`;
  }

  // YouTube + Facebook
  const yt = s.youtube || "https://youtube.com/@bionerds-tq4bk", fbk = s.facebook || "https://www.facebook.com/share/1DK7J9zFNW/";
  html += `<div class="h-sec">🎬 ফ্রি ক্লাস ও আপডেট</div>` +
    (vids.length?`<div class="vids">${vids.map(id=>`<a href="https://youtu.be/${id}" target="_blank" rel="noopener"><img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="" loading="lazy"></a>`).join("")}</div>`:"") +
    `<a class="lnk" href="${esc(yt)}" target="_blank" rel="noopener"><span class="ic" style="background:#ff0000">▶</span><div><b>YouTube — ফ্রি ক্লাস</b><span>BIO NERDS চ্যানেলে বায়োলজির ফ্রি ক্লাস দেখো</span></div><span class="ar">›</span></a>
    <a class="lnk" href="${esc(fbk)}" target="_blank" rel="noopener"><span class="ic" style="background:#1877f2;font-family:Poppins;font-weight:800">f</span><div><b>Facebook পেজ</b><span>নোটিশ, রেজাল্ট আর আপডেট সবার আগে</span></div><span class="ar">›</span></a>
    <a class="lnk" href="${waLink(COACHING.whatsapp,"আসসালামু আলাইকুম")}" target="_blank" rel="noopener"><span class="ic" style="background:#25d366">✆</span><div><b>WhatsApp</b><span>${esc(COACHING.whatsapp)}</span></div><span class="ar">›</span></a>`;

  html += `<div id="instBox"></div>
    <div class="h-foot"><b class="brand" style="color:var(--g)">BIO NERDS</b> — Seek For Knowledge<br>📍 ${esc(COACHING.address)}<br>📞 ${esc(COACHING.phones)}</div>`;
  $("#homeMain").innerHTML = html;
  paintInstall();
}
function fmtShort(d){ const x=new Date(d); return isNaN(x)?d:x.toLocaleDateString("en-GB",{day:"numeric",month:"short"}).replace(/Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec/,m=>({Jan:"জানু",Feb:"ফেব্রু",Mar:"মার্চ",Apr:"এপ্রিল",May:"মে",Jun:"জুন",Jul:"জুলাই",Aug:"আগস্ট",Sep:"সেপ্টে",Oct:"অক্টো",Nov:"নভে",Dec:"ডিসে"}[m])); }
function openAdmission(){ window.open(waLink(COACHING.whatsapp, admissionMsg()), "_blank"); }
function paintInstall(){
  const box = $("#instBox"); if(!box) return;
  if(isStandalone() || (!INSTALL_EVT && !isIOS())){ box.innerHTML=""; return; }
  box.innerHTML = `<div class="inst"><img src="icon-192.png" alt=""><div style="flex:1;min-width:0"><b>অ্যাপ হিসেবে ইনস্টল করো</b><div style="font-size:13px;opacity:.85">ফোনের হোম স্ক্রিনে BIO NERDS — এক ট্যাপে রেজাল্ট ও রুটিন</div></div><button class="btn white" onclick="doInstall()">ইনস্টল</button></div>`;
}
async function doInstall(){
  if(INSTALL_EVT){ INSTALL_EVT.prompt(); try{ await INSTALL_EVT.userChoice; }catch(e){} INSTALL_EVT=null; paintInstall(); return; }
  const sh=document.createElement("div"); sh.className="sheet"; sh.onclick=e=>{ if(e.target===sh) sh.remove(); };
  sh.innerHTML = `<div><h3>📲 iPhone-এ ইনস্টল করার নিয়ম</h3><ol>
    <li><b>Safari</b> দিয়ে এই সাইট খোলো (bionerdsbd.github.io)</li>
    <li>নিচের <b>Share</b> বাটনে (⬆️ বক্স থেকে তীর) চাপো</li>
    <li>নিচে স্ক্রল করে <b>“Add to Home Screen”</b> চাপো</li>
    <li>উপরে ডানে <b>Add</b> চাপো — হোম স্ক্রিনে BIO NERDS অ্যাপ চলে আসবে ✅</li></ol>
    <button class="btn" onclick="this.closest('.sheet').remove()">বুঝেছি</button></div>`;
  document.body.appendChild(sh);
}

/* ---------------- অ্যাডমিন: হোম পেজ ---------------- */
async function admHome(){
  $("#admMain").innerHTML = '<div class="spin"></div>';
  let s = {};
  try{ s = await rpc("admin_get_site",{p_token:TOKEN}); }catch(ex){ $("#admMain").innerHTML='<div class="err">'+esc(ex.message)+'<br>হোম পেজের SQL চালানো হয়েছে তো?</div>'; return; }
  $("#admMain").innerHTML = `
    <div class="card"><div class="row between"><h3 style="margin:0">🌐 পাবলিক হোম পেজ</h3><button class="btn sm sec" onclick="HOME=null;show('homeView')">দেখো ↗</button></div>
      <label style="display:flex;align-items:center;gap:10px;margin-top:14px"><input type="checkbox" id="hsOpen" style="width:22px;height:22px" ${s.admission_open!==false?"checked":""}> “ভর্তি চলছে” দেখাও</label>
      <label>ভর্তির লেখা</label><input id="hsAdm" value="${esc(s.admission_text||"")}">
      <label>📌 বিশেষ ঘোষণা (খালি রাখলে দেখাবে না)</label><textarea id="hsHl" style="font-family:inherit;min-height:70px">${esc(s.highlight||"")}</textarea>
      <label>🗓️ ক্লাস রুটিন — প্রতি লাইনে: <b>ব্যাচ = দিন সময়, দিন সময়</b></label>
      <textarea id="hsRt" style="font-family:inherit">${esc(s.routine||"")}</textarea>
      <div class="hint" style="margin-top:4px">Star of the Week শুধু রুটিনে থাকা ব্যাচগুলোর জন্য দেখাবে।</div>
      <label>🎬 YouTube ভিডিও লিংক (ঐচ্ছিক, প্রতি লাইনে একটা — হোম পেজে থাম্বনেইল দেখাবে)</label>
      <textarea id="hsVid" style="font-family:inherit;min-height:80px" placeholder="https://youtu.be/...">${esc(s.videos||"")}</textarea>
      <label>YouTube চ্যানেল</label><input id="hsYt" value="${esc(s.youtube||"")}">
      <label>Facebook পেজ</label><input id="hsFb" value="${esc(s.facebook||"")}">
      <button class="btn" id="hsSave">সেভ করো</button><div id="hsMsg"></div></div>
    <div class="sec-title">💬 মতামত</div>
    <div class="card"><h3>➕ নিজে মতামত যোগ করো</h3><div class="muted">পুরনো স্টুডেন্ট বা অভিভাবকের মতামত (সরাসরি হোম পেজে যাবে)</div>
      <label>নাম</label><input id="afN" placeholder="যেমন: রাহাত হাসান">
      <label>পরিচয়</label><input id="afM" placeholder="যেমন: HSC'25 • এখন CuMC-তে">
      <label>মতামত</label><textarea id="afB" style="font-family:inherit;min-height:80px"></textarea>
      <button class="btn sec" id="afSave">যোগ করো</button></div>
    <div id="fbList"><div class="spin"></div></div>`;
  $("#hsSave").onclick = async () => {
    const v = {...s, admission_open:$("#hsOpen").checked, admission_text:$("#hsAdm").value.trim(), highlight:$("#hsHl").value.trim(),
      routine:$("#hsRt").value.trim(), videos:$("#hsVid").value.trim(), youtube:$("#hsYt").value.trim(), facebook:$("#hsFb").value.trim()};
    try{ await rpc("admin_save_site",{p_token:TOKEN,p_value:v}); s=v; HOME=null; $("#hsMsg").innerHTML='<div class="ok">✅ সেভ হয়েছে — হোম পেজে এখনই দেখাবে</div>'; }
    catch(ex){ $("#hsMsg").innerHTML='<div class="err">'+esc(ex.message)+'</div>'; }
  };
  $("#afSave").onclick = async () => {
    if(!$("#afN").value.trim() || !$("#afB").value.trim()){ toast("নাম আর মতামত দুটোই লাগবে"); return; }
    try{ await rpc("admin_add_feedback",{p_token:TOKEN,p_name:$("#afN").value,p_meta:$("#afM").value,p_body:$("#afB").value,p_rating:5});
      ["#afN","#afM","#afB"].forEach(x=>$(x).value=""); HOME=null; toast("যোগ হয়েছে ✅"); loadFb(); }catch(ex){ toast(ex.message); }
  };
  loadFb();
}
async function loadFb(){
  try{
    const l = await rpc("admin_feedback",{p_token:TOKEN});
    $("#fbList").innerHTML = l.length ? l.map(f=>`<div class="card" style="border-left:5px solid ${f.approved?"var(--g3)":"var(--gold)"}">
      <div class="row between"><div><b>${esc(f.name||"")}</b> ${f.roll?`<span class="muted">• ${esc(f.roll)}</span>`:""}<div class="muted" style="font-size:12.5px">${esc(f.meta||"")} • ${fmtDate(f.created_at)}</div></div>
      <span class="chip ${f.approved?"":"warn"}">${f.approved?"হোম পেজে আছে":"অপেক্ষায়"}</span></div>
      <div style="color:var(--gold);margin-top:6px">${"★".repeat(f.rating||5)}</div><p style="white-space:pre-wrap">${esc(f.body)}</p>
      <div class="row" style="gap:8px;margin-top:10px">${f.approved?`<button class="btn sm ghost" onclick="setFb(${f.id},false)">হোম পেজ থেকে সরাও</button>`:`<button class="btn sm" onclick="setFb(${f.id},true)">✅ হোম পেজে দেখাও</button>`}
      <button class="btn sm danger" onclick="delFb(${f.id})">🗑</button></div></div>`).join("") : '<div class="card muted">এখনো কোনো মতামত আসেনি। স্টুডেন্টরা পোর্টালের হোম থেকে মতামত দিতে পারবে।</div>';
  }catch(ex){ $("#fbList").innerHTML='<div class="err">'+esc(ex.message)+'</div>'; }
}
async function setFb(id,ok){ try{ await rpc("admin_feedback_set",{p_token:TOKEN,p_id:id,p_approved:ok}); HOME=null; loadFb(); }catch(ex){ toast(ex.message); } }
async function delFb(id){ if(!confirm("মতামতটা মুছবে?")) return; try{ await rpc("admin_feedback_delete",{p_token:TOKEN,p_id:id}); HOME=null; loadFb(); }catch(ex){ toast(ex.message); } }

/* ---------------- শুরু ---------------- */
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
if (TOKEN && configured()) start(); else show("homeView");
</script>
</body>
